<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PathSnap Trip Viewer</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    :root { --bg:#f4f7fb; --panel:#fff; --ink:#172033; --muted:#667085; --line:#d9e1ec; --accent:#2563eb; }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--ink); background:var(--bg); font:14px/1.4 system-ui,-apple-system,Segoe UI,sans-serif; }
    .shell { display:grid; grid-template-columns:340px minmax(0,1fr); height:100vh; }
    aside { overflow:auto; padding:18px; background:var(--panel); border-right:1px solid var(--line); }
    h1 { margin:0 0 4px; font-size:21px; }
    .subtitle { margin:0 0 16px; color:var(--muted); }
    .drop { display:block; border:1px dashed #9daac0; border-radius:10px; padding:12px; margin-bottom:8px; background:#fbfcfe; }
    .drop strong { display:block; margin-bottom:6px; }
    input[type=file] { width:100%; }
    button { width:100%; border:0; border-radius:8px; padding:10px 14px; background:var(--accent); color:white; font-weight:700; cursor:pointer; }
    button:disabled { opacity:.55; cursor:not-allowed; }
    #status { min-height:21px; margin:10px 0; color:var(--muted); }
    #status.error { color:#b42318; }
    .legend { display:grid; gap:7px; margin-top:12px; padding:10px; border:1px solid var(--line); border-radius:8px; }
    .legend div { display:flex; align-items:center; gap:8px; }
    .swatch { width:22px; height:4px; border-radius:2px; display:inline-block; }
    #counts { display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-top:10px; }
    .count { border:1px solid var(--line); border-radius:8px; padding:8px; }
    .count strong { display:block; font-size:17px; }
    .count span { color:var(--muted); font-size:12px; }
    #map { height:100vh; background:#dfe6ee; }
    @media (max-width: 760px) { .shell { grid-template-columns:1fr; height:auto; } aside { height:auto; border-right:0; border-bottom:1px solid var(--line); } #map { height:65vh; } }
  </style>
</head>
<body>
  <div class="shell">
    <aside>
      <h1>PathSnap Trip Viewer</h1>
      <p class="subtitle">Upload one complete trip containing all four dataset files.</p>
      <form id="upload">
        <label class="drop"><strong>GPS observations (.track)</strong><input type="file" name="track" accept=".track" required></label>
        <label class="drop"><strong>Road nodes (.nodes)</strong><input type="file" name="nodes" accept=".nodes" required></label>
        <label class="drop"><strong>Road arcs (.arcs)</strong><input type="file" name="arcs" accept=".arcs" required></label>
        <label class="drop"><strong>Reference route (.route)</strong><input type="file" name="route" accept=".route" required></label>
        <button id="submit" type="submit">Analyze trip</button>
      </form>
      <div id="status">Choose all four files.</div>
      <div class="legend" aria-label="Map legend">
        <div><i class="swatch" style="background:#16a34a"></i>Original/reference graph</div>
        <div><i class="swatch" style="background:#2563eb"></i>User/GPS path</div>
        <div><i class="swatch" style="background:#dc2626"></i>Predicted path</div>
      </div>
      <div id="counts"></div>
    </aside>
    <div id="map"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const map = L.map('map', { preferCanvas: true }).setView([20, 20], 3);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    let layers = null;
    let layerControl = null;
    const statusEl = document.getElementById('status');
    const submitEl = document.getElementById('submit');

    function setStatus(message, error = false) {
      statusEl.textContent = message;
      statusEl.className = error ? 'error' : '';
    }

    document.getElementById('upload').addEventListener('submit', async (event) => {
      event.preventDefault();
      const form = event.currentTarget;
      const data = new FormData(form);

      for (const kind of ['track', 'nodes', 'arcs', 'route']) {
        const file = data.get(kind);
        if (!file || !file.name || !file.name.toLowerCase().endsWith('.' + kind)) {
          setStatus('Add exactly one valid .' + kind + ' file.', true);
          return;
        }
      }

      submitEl.disabled = true;
      setStatus('Reading trip and running the production model...');
      try {
        const response = await fetch('/trip/analyze', { method: 'POST', body: data });
        const body = await response.json();
        if (!response.ok) throw new Error(body.detail || 'The trip could not be analyzed');
        drawTrip(body);
      } catch (error) {
        setStatus(error.message, true);
      } finally {
        submitEl.disabled = false;
      }
    });

    function drawTrip(data) {
      if (layers) {
        Object.values(layers).forEach(layer => map.removeLayer(layer));
        layers = null;
      }
      if (layerControl) {
        map.removeControl(layerControl);
        layerControl = null;
      }

      const reference = L.polyline(data.route_segments, {
        color: '#16a34a', weight: 2, opacity: 0.95
      });
      const user = L.polyline(data.gps_points, {
        color: '#2563eb', weight: 3, opacity: 0.95
      });
      const predicted = L.polyline(data.predicted_route_segments, {
        color: '#dc2626', weight: 2.5, opacity: 0.95
      });

      const gpsMarkers = L.layerGroup(data.gps_points.map(point =>
        L.circleMarker(point, { radius: 2, color: '#2563eb', weight: 1, fillOpacity: 0.75 })
      ));

      layers = { reference, user, gpsMarkers, predicted };
      Object.values(layers).forEach(layer => layer.addTo(map));

      layerControl = L.control.layers(null, {
        'Original/reference graph': reference,
        'User/GPS path': user,
        'User/GPS points': gpsMarkers,
        'Predicted path': predicted
      }, { collapsed: false }).addTo(map);

      const bounds = L.latLngBounds(data.gps_points);
      if (bounds.isValid()) map.fitBounds(bounds.pad(0.08));

      const counts = data.counts;
      document.getElementById('counts').innerHTML = `
        <div class="count"><strong>${counts.gps_observations}</strong><span>GPS observations</span></div>
        <div class="count"><strong>${counts.nodes}</strong><span>Road nodes</span></div>
        <div class="count"><strong>${counts.arcs}</strong><span>Road arcs</span></div>
        <div class="count"><strong>${counts.reference_route_arcs}</strong><span>Reference arcs</span></div>`;
      setStatus(`${data.model}: prediction ready. The reference graph uses the uploaded .route file.`);
    }
  </script>
</body>
</html>
